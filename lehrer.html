  .profile-avatar { position: relative; width: 150px; height: 150px; border-radius: 50%; overflow: hidden; border: 4px solid var(--sage-pale); box-shadow: 0 6px 20px oklch(38% 0.06 145 / 0.14); flex: none; }

  .profile-name { font-family: var(--font-heading); font-size: clamp(1.6rem, 2.6vw, 2.1rem); font-weight: 700; color: var(--text); line-height: 1.15; margin-bottom: 6px; }
  .profile-primary { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; color: var(--sage-dark); font-size: 1.02rem; margin-bottom: 14px; }

  .profile-meta a { color: var(--text-light); text-decoration: none; border-bottom: 1px solid var(--sage-light); }

  .block-label { display: inline-flex; align-items: center; gap: 9px; font-size: 0.74rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.13em; color: var(--sage); margin-bottom: 16px; }
  .block-label svg { width: 17px; height: 17px; }

  .rollen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .rollen-box { background: var(--white); border: 1.5px solid var(--cream-dark); border-radius: var(--radius); padding: 22px 24px; }

  .zitat .mark { font-family: var(--font-heading); font-size: 6rem; line-height: 0.6; color: var(--sage-mid); opacity: 0.5; position: absolute; top: 28px; left: 30px; }
  .zitat blockquote { font-family: var(--font-heading); font-style: italic; font-size: clamp(1.3rem, 2.3vw, 1.7rem); line-height: 1.45; position: relative; z-index: 1; padding-left: 30px; }
  .zitat .cite { margin-top: 18px; padding-left: 30px; font-size: 0.85rem; font-weight: 700; color: var(--sage-light); text-transform: uppercase; letter-spacing: 0.08em; }

  .quickbar-wrap { background: var(--cream-mid); border-top: 1.5px solid var(--cream-dark); padding: 40px 48px 56px; }
  .quickbar-inner { max-width: 1080px; margin: 0 auto; }
  .quickbar-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }

  .quickbar-head a { color: var(--sage); font-weight: 700; text-decoration: none; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }
  .quickbar-head a:hover { gap: 9px; }
  .quickbar { display: flex; gap: 12px; overflow-x: auto; padding: 8px 0; margin-top: -8px; scroll-snap-type: x proximity; }
  .qb-card { scroll-snap-align: start; flex: 0 0 auto; width: 138px; text-decoration: none; background: var(--white); border: 1.5px solid var(--cream-dark); border-radius: var(--radius); padding: 18px 14px; text-align: center; transition: transform 0.18s, box-shadow 0.18s, border-color 0.18s; }
  .qb-card:hover { transform: translateY(-3px); box-shadow: 0 8px 22px oklch(38% 0.06 145 / 0.13); border-color: var(--sage-light); }
  .qb-card.current { border-color: var(--sage); background: var(--sage-pale); cursor: default; }
  .qb-card.current:hover { transform: none; box-shadow: none; }
  .qb-av { position: relative; width: 64px; height: 64px; border-radius: 50%; overflow: hidden; margin: 0 auto 10px; border: 2.5px solid var(--cream-dark); }
  .qb-card.current .qb-av { border-color: var(--sage-mid); }
  .qb-av img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; opacity: 0; }
  .qb-av .av-ini { position: absolute; inset: 0; z-index: 0; display: flex; align-items: center; justify-content: center; color: var(--white); font-weight: 700; font-size: 1.25rem; }
  .qb-name { font-weight: 700; font-size: 0.84rem; color: var(--text); line-height: 1.25; margin-bottom: 3px; }
  .qb-role { font-size: 0.72rem; color: var(--text-light); line-height: 1.3; }
  .qb-card.current .qb-tag { display: inline-block; margin-top: 7px; font-size: 0.62rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; color: var(--sage-dark); }

  footer { background: var(--sage-dark); padding: 32px 48px; display: flex; align-items: center; justify-content: space-between; color: var(--sage-light); font-size: 0.85rem; }

  footer a:hover { color: var(--white); }

  @media (max-width: 760px) {
    nav { padding: 0 20px; }
    .nav-pill { display: inline-flex; align-items: center; background: var(--white); color: var(--sage); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.13em; padding: 5px 14px; border-radius: 30px; border: 1.5px solid var(--sage-pale); white-space: nowrap; }
  .nav-links { display: none; }
    .page-hero { padding: 40px 20px 130px; }
    .page-body { padding: 0 20px 48px; }
    .profile-head { grid-template-columns: 1fr; text-align: center; gap: 18px; padding: 28px 22px; }
    .profile-avatar { margin: 0 auto; width: 124px; height: 124px; }
    .profile-primary, .profile-meta { justify-content: center; }
    .rollen-grid { grid-template-columns: 1fr; }
    .zitat { padding: 40px 26px 32px; }
    .zitat blockquote, .zitat .cite { padding-left: 14px; }
    .zitat .mark { left: 14px; }
    .quickbar-wrap { padding: 32px 20px 44px; }
    footer { flex-direction: column; gap: 12px; text-align: center; }
  }
</style>

    bahr: {
      haltung: [
        'Kreativität braucht Freiraum und das Gefühl, dass nichts „falsch“ ist. Ob in Deutsch, Musik oder Bildnerischer Erziehung — der Mut zum Ausprobieren zählt mehr als das perfekte Ergebnis.',
        'Als Klassenvorstand der 4b begleite ich meine Klasse auf den letzten Metern bis zum Abschluss — mit offenem Ohr und klarem Blick.'
      ],
      zitat: 'Jedes Kind ist kreativ — man muss ihm nur Material und Vertrauen geben.'
    },
    leithner: {
      haltung: [
        'Mathematik und Biologie erklären, wie unsere Welt funktioniert. Ich möchte, dass Schülerinnen und Schüler genau hinschauen, staunen und selbst nach Erklärungen suchen.',
        'Mir ist wichtig, dass jede und jeder ein eigenes Tempo haben darf. Wer einmal den Faden verliert, bekommt bei mir die Zeit, ihn wiederzufinden.'
      ],
      zitat: 'Naturwissenschaft beginnt mit dem Mut, „warum?“ zu fragen.'
    },
    kern: {
      haltung: [
        'Sprachen sind das Tor zu anderen Kulturen. Ich möchte Neugier auf die Welt wecken und zeigen, wie viel näher sie rückt, wenn man sich verständigen kann.',
        'Im Native-English-Unterricht zählt für mich vor allem eines: einfach loszusprechen — Sicherheit kommt mit der Übung.'
      ],
      zitat: 'Eine neue Sprache ist ein neues Fenster zur Welt.'
    },
    kainberger: {
      haltung: [
        'Eine Sprache lebt vom Sprechen. In meinem Englischunterricht wird ausprobiert, gespielt und kommuniziert, denn so bleibt Gelerntes am besten hängen.',
        'Im Sport erleben die Jugendlichen Teamgeist, Fairness und Durchhaltevermögen — Eigenschaften, die im ganzen Leben zählen.'
      ],
      zitat: 'Dranbleiben lohnt sich — beim Sport wie beim Lernen.'
    },
    gaudriot: {
      haltung: [
        'Gestalten heißt, mit Kopf und Händen zu denken. Gerade Kinder, die sich mit Worten schwertun, blühen oft auf, wenn sie etwas mit eigenen Händen schaffen dürfen.',
        'In Ernährung und Haushalt geht es um Alltagskompetenz — ums Selbermachen, Ausprobieren und um die Freude an einem gelungenen Ergebnis.'
      ],
      zitat: 'Was man selbst geschaffen hat, vergisst man nicht.'
    },
    dorke: {
      haltung: [
        'Ob in Deutsch oder Englisch — ich möchte, dass Kinder Freude an Sprache entwickeln und den Mut finden, sich auszudrücken.',
        'Lesen und Erzählen öffnen Welten. Mir ist wichtig, dass sich jede und jeder mit der eigenen Stimme einbringen darf.'
      ],
      zitat: 'Wer liest, reist — ohne den Raum zu verlassen.'
    },
    ruth: {
      haltung: [
        'Biologie versteht man am besten mit allen Sinnen. Ich verlege den Unterricht, wann immer es geht, nach draußen und lasse die Jugendlichen selbst beobachten und entdecken.',
        'Nachhaltigkeit ist für mich keine Floskel, sondern eine Haltung, die im Kleinen beginnt und ein Leben lang trägt.'
      ],
      zitat: 'Man schützt nur, was man kennt und liebgewonnen hat.'
    },
    liebhart: {
      haltung: [
        'Physik erzählt von den großen Fragen — vom Allerkleinsten bis zu den Sternen. Ich möchte zeigen, wie viel Staunen in scheinbar trockenen Formeln steckt.',
        'Verstehen entsteht durch Ausprobieren. Im Unterricht darf experimentiert, gestaunt und auch einmal gescheitert werden.'
      ],
      zitat: 'Wer zu den Sternen schaut, stellt die besten Fragen.'
    },
    schiroky: {
      haltung: [
        'Vorlesen schenkt Zeit und Aufmerksamkeit. Als Lese-Omi nehme ich mir genau diese Zeit für unsere Kinder — ganz ohne Noten und Druck.',
        'Geschichten verbinden Generationen. Es macht mich glücklich, die Freude am Lesen weiterzugeben.'
      ],
      zitat: 'Eine Geschichte zu teilen, ist das schönste Geschenk.'
    },
  };

  function byId(id) { return TEAM.find(t => t.id === id); }

  // Avatar: farbiger Initialen-Kreis; nur bei vorhandenem Foto (member.foto)
  // wird ein Bild darueber gelegt. So keine vergeblichen Anfragen.
  // PHOTO_V bei neuen/ausgetauschten Fotos erhoehen, damit der Cache bricht.
  const PHOTO_V = '3';
  function avatarHtml(member, baseCls, priority) {
    const ini = `<span class="av-ini">${esc(initials(member.name))}</span>`;
    let photo = '';
    if (member.foto) {
      const prio = priority ? ' fetchpriority="high"' : '';
      const pos = member.pos ? ` style="object-position:${member.pos}"` : '';
      photo = `<img src="uploads/${member.id}.jpg?v=${PHOTO_V}" alt="${esc(member.name)}"${prio}${pos} onload="this.style.opacity=1">`;
    }
    return `<div class="${baseCls}" style="background:${grad(member.color)}">${ini}${photo}</div>`;
  }

  const params = new URLSearchParams(location.search);
  const current = byId(params.get('id')) || TEAM[0];

  document.title = current.name + ' – MS Hirtenberg';
  document.getElementById('hero-title').textContent = current.name;

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function initials(name) { return name.split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }
  const grad = c => GRAD[c] || GRAD.sage;

  // ── Profile body ──
  const subjectChips = current.subjects.map(s => `<span class="chip">${esc(s)}</span>`).join('');
  const taskItems = current.tasks.map(t =>
    `<li${t.lead ? ' style="font-weight:700"' : ''}>${esc(t.t)}</li>`
  ).join('');

  const boxes = [];
  if (current.subjects.length) {
    boxes.push(`<div class="rollen-box"><h3>Unterrichtsfächer</h3><div class="chips">${subjectChips}</div></div>`);
  }
  if (current.tasks.length) {
    boxes.push(`<div class="rollen-box"><h3>Aufgaben an der Schule</h3><ul class="task-list">${taskItems}</ul></div>`);
  }
  const gridStyle = boxes.length < 2 ? ' style="grid-template-columns:1fr"' : '';

  const klasseLine = current.klasse
    ? `<span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-7h6v7"/></svg>Klassenvorstand der Klasse ${esc(current.klasse)}</span>`
    : '';
  const noteBlock = current.note
    ? `<div class="section-block"><div class="haltung"><p>${esc(current.note)}</p></div></div>`
    : '';

  const bio = BIOS[current.id] || { haltung: [], zitat: '' };
  const haltungHtml = bio.haltung.map(p => `<p>${esc(p)}</p>`).join('');
  const haltungBlock = bio.haltung.length ? `
    <div class="section-block">
      <div class="block-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-4.5-9.5-9A5 5 0 0 1 12 5a5 5 0 0 1 9.5 7c-2.5 4.5-9.5 9-9.5 9z"/></svg>
        Meine Haltung
      </div>
      <div class="haltung">${haltungHtml}</div>
    </div>` : '';
  const zitatBlock = bio.zitat ? `
    <div class="section-block">
      <div class="zitat">
        <span class="mark">&ldquo;</span>
        <blockquote>${esc(bio.zitat)}</blockquote>
        <div class="cite">— ${esc(current.name)}</div>
      </div>
    </div>` : '';

  document.getElementById('profile-root').innerHTML = `
    <div class="profile-head">
      ${avatarHtml(current, 'profile-avatar', true)}
      <div>
        <div class="profile-name">${esc(current.name)}</div>
        <div class="profile-primary"><span class="leaf"></span>${esc(current.role)}</div>
        <div class="profile-meta">
          ${klasseLine}
          <span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><a href="mailto:hs.hirtenberg@noeschule.at">hs.hirtenberg@noeschule.at</a></span>
          <span class="mi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.69 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.33 1.85.56 2.81.69A2 2 0 0 1 22 16.92z"/></svg>02256 - 81131</span>
        </div>
      </div>
    </div>

    <div class="section-block">
      <div class="block-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
        Rollen &amp; Aufgaben
      </div>
      <div class="rollen-grid"${gridStyle}>${boxes.join('')}</div>
    </div>

    ${noteBlock}
    ${haltungBlock}
    ${zitatBlock}
  `;

  // ── Schnell-Leiste ──
  const ordered = [current, ...TEAM.filter(t => t.id !== current.id)];
  document.getElementById('quickbar').innerHTML = ordered.map(t => {
    const av = avatarHtml(t, 'qb-av', false);
    if (t.id === current.id) {
      return `<div class="qb-card current">
        ${av}
        <div class="qb-name">${esc(t.name)}</div>
        <div class="qb-role">${esc(t.role)}</div>
        <span class="qb-tag">Sie sind hier</span>
      </div>`;
    }
    return `<a class="qb-card" href="lehrer.html?id=${t.id}">
      ${av}
      <div class="qb-name">${esc(t.name)}</div>
      <div class="qb-role">${esc(t.role)}</div>
    </a>`;
  }).join('');

  window.scrollTo(0, 0);
</script>

</body>
</html>
